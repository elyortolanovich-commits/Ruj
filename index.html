            { name: "BerlinChleb", category: "przyprawy", price: "95zł", code: "image_7.png", badge: "Pieczywo" }
        ];

        let currentCategory = 'all';
        let searchQuery = '';

        const productGrid = document.getElementById('productGrid');
        const searchInput = document.getElementById('searchInput');
        const categoryButtons = document.querySelectorAll('.cat-btn');
        const noResults = document.getElementById('noResults');

        function renderProducts() {
            productGrid.innerHTML = '';

            const filtered = products.filter(p => {
                const matchesCategory = currentCategory === 'all' || p.category === currentCategory;
                const matchesSearch = p.name.toLowerCase().includes(searchQuery.toLowerCase());
                return matchesCategory && matchesSearch;
            });

            if (filtered.length === 0) {
                noResults.classList.remove('hidden');
                return;
            } else {
                noResults.classList.add('hidden');
            }

            filtered.forEach(p => {
                const card = document.createElement('div');
                card.className = 'product-card bg-white rounded-2xl p-5 border border-slate-100 shadow-sm flex flex-col justify-between';
                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start mb-3">
                            <span class="bg-emerald-50 text-emerald-700 text-xs font-semibold px-2.5 py-1 rounded-lg">${p.badge}</span>
                            <span class="text-xs text-slate-400 font-mono">${p.code}</span>
                        </div>
                        <h3 class="font-semibold text-slate-800 text-base mb-2 leading-snug">${p.name}</h3>
                    </div>
                    <div class="pt-4 border-t border-slate-100 flex items-center justify-between mt-2">
                        <div>
                            <span class="text-xs text-slate-400 block">Cena</span>
                            <span class="text-lg font-bold text-slate-900">${p.price}</span>
                        </div>
                        <a href="https://wa.me/48666041259?text=Dzień%20dobry,%20interesuje%20mnie%20produkt:%20${encodeURIComponent(p.name)}" target="_blank" rel="noopener noreferrer" class="bg-slate-900 hover:bg-emerald-600 text-white p-2.5 rounded-xl transition text-sm flex items-center justify-center shadow-sm">
                            <i class="fa-solid fa-cart-shopping"></i>
                        </a>
                    </div>
                `;
                productGrid.appendChild(card);
            });
        }

        // Event Listeners for search & filtering
        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value;
            renderProducts();
        });

        categoryButtons.forEach(btn => {
            btn.addEventListener('click', (e) => {
                categoryButtons.forEach(b => {
                    b.classList.remove('bg-slate-900', 'text-white');
                    b.classList.add('bg-white', 'text-slate-600', 'border', 'border-slate-200');
                });
                e.target.classList.remove('bg-white', 'text-slate-600', 'border', 'border-slate-200');
                e.target.classList.add('bg-slate-900', 'text-white');

                currentCategory = e.target.getAttribute('data-category');
                renderProducts();
            });
        });

        // Initial render on load
        window.onload = () => {
            renderProducts();
        };
